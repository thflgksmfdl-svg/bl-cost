    <ellipse cx="65" cy="55" rx="6" ry="3.5" fill="#F5C8BA"/>
    <g class="eyes" fill="#674B3C"><ellipse cx="37" cy="48" rx="2.2" ry="3"/><ellipse cx="59" cy="48" rx="2.2" ry="3"/></g>
