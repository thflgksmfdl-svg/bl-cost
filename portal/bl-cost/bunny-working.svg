    <path d="M48 56C46 60 43 58 43 57M48 56C50 60 53 58 53 57" stroke="#805B49" stroke-width="1.7" stroke-linecap="round"/>
  </g>
  <path d="M35 75H61V98L57 96L53 98L49 96L45 98L41 96L35 98Z" fill="#F0F7ED" stroke="#6B8E78" stroke-width="1.8" stroke-linejoin="round"/>
