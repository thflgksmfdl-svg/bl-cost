  <ellipse cx="64" cy="96" rx="10" ry="4" fill="#FFF9EE" stroke="#805B49" stroke-width="2"/>
  <g class="head">
    <g class="ear-left">
      <path d="M30 38C20 21 24 5 31 5C38 5 42 24 40 39" fill="#FFF9EE" stroke="#805B49" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M31 13C28 17 30 28 34 33" stroke="#F1B9AD" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g class="ear-right">
      <path d="M54 37C52 21 59 3 66 6C74 10 69 27 63 40" fill="#FFF9EE" stroke="#805B49" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M64 14C64 20 61 27 59 31" stroke="#F1B9AD" stroke-width="5" stroke-linecap="round"/>
    </g>
    <path d="M21 49C21 34 31 28 48 28S75 35 75 49C75 64 64 70 48 70S21 64 21 49Z" fill="#FFF9EE" stroke="#805B49" stroke-width="2.2"/>
