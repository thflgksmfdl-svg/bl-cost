<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 106" fill="none">
  <style>
    .ear-left,.ear-right,.head,.eyes,.paw { transform-box:fill-box; }
    .ear-left { transform-origin:50% 95%; animation:ear-left 4.8s ease-in-out infinite; }
    .ear-right { transform-origin:50% 95%; animation:ear-right 4.8s ease-in-out infinite; }
    .head { transform-origin:50% 90%; animation:nod 4.8s ease-in-out infinite; }
    .eyes { transform-origin:center; animation:blink 4.8s ease-in-out infinite; }
    .paw { transform-origin:50% 60%; animation:check 2.4s ease-in-out infinite; }
    @keyframes ear-left { 0%,48%,74%,100% { transform:rotate(0); } 56% { transform:rotate(-9deg); } 64% { transform:rotate(3deg); } }
    @keyframes ear-right { 0%,52%,80%,100% { transform:rotate(0); } 62% { transform:rotate(8deg); } 70% { transform:rotate(-2deg); } }
    @keyframes nod { 0%,38%,82%,100% { transform:rotate(0); } 58% { transform:translateY(1px) rotate(-3deg); } }
    @keyframes blink { 0%,31%,35%,83%,87%,100% { transform:scaleY(1); } 33%,85% { transform:scaleY(.12); } }
    @keyframes check { 0%,18%,68%,100% { transform:translate(0,0) rotate(0); } 34%,52% { transform:translate(1px,2px) rotate(7deg); } 43% { transform:translate(0,0) rotate(2deg); } }
    @media(prefers-reduced-motion:reduce) { .ear-left,.ear-right,.head,.eyes,.paw { animation:none; } }
  </style>
