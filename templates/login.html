{% extends 'base.html' %}{% block content %}<main id="main" class="container auth"><section class="auth-intro"><h1>BL 하나로 시작하는<br>작업비 정산</h1><p>중판에서 작업내역을 가져오고, 추가 청구를 검토한 뒤 공유시트에 반영하세요.</p><ul><li>원본 오더넘버와 작업내역 보존</li><li>실제 시간과 추가 청구 분리</li><li>승인 후 저장 결과 검산</li></ul></section>
<section class="auth-form"><h2>직원 로그인</h2><form method="post">{% csrf_token %}<label for="username">아이디</label><input id="username" name="username" autocomplete="username" required maxlength="150"><label for="password">비밀번호</label><input id="password" type="password" name="password" autocomplete="current-password" required><p class="help" role="alert">{{ error }}</p><button class="primary full" type="submit">로그인</button></form><p class="muted">직원 계정은 관리자에게 요청해 주세요.</p></section></main>{% endblock %}
